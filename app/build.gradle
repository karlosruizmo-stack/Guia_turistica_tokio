plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.guia_turistica_tokio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.guia_turistica_tokio'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
}
